<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <title>3D Pacman Invaders</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js"}}</script>
</head>
<body>
  <main id="game" aria-label="3D Pacman speelveld">
    <button id="start-button" type="button">Start spel</button>
  </main>
  <nav id="touch-controls" aria-label="Touchbesturing">
    <button data-action="move-up">▲</button>
    <button data-action="move-left">◀</button>
    <button data-action="move-down">▼</button>
    <button data-action="move-right">▶</button>
    <button class="pause" data-action="pause">Pauze</button>
    <button class="restart" data-action="restart">Herstart</button>
  </nav>
  <noscript>Dit spel vereist JavaScript.</noscript>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
